version: "3.8"

services:
  database:
    image: mongo
    container_name: mongo-${ENV}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network

  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-${ENV}
    ports:
      - "5001:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - app-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-${ENV}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge


