version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-${ENV}
    ports:
      - "${BACKEND_PORT:-5003}:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: "${MONGO_URI}"  # Connects to your MongoDB Atlas
    restart: always
    networks:
      - app-network
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 10s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-${ENV}
    ports:
      - "${FRONTEND_PORT:-3003}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  mongo:
    image: mongo
    container_name: mongo-${ENV}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    ports:
      - "${MONGO_PORT:-27018}:27017"
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5

networks:
  app-network:
    driver: bridge
