version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-${BRANCH_NAME}
    ports:
      - "${BACKEND_PORT:-5003}:5000"
    environment:
      MONGO_URI: ${MONGO_URI}
      MONGO_USER: ${MONGO_USER}
      MONGO_PASS: ${MONGO_PASS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-${BRANCH_NAME}
    ports:
      - "${FRONTEND_PORT:-3003}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
