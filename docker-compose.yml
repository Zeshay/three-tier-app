version: "3.8"

services:
  database:
    image: mongo
    container_name: mongo-${ENV}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always
    networks:
      - app-network
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-${ENV}
    ports:
      - "5002:5000"
    depends_on:
      - database
    env_file:
      - ./backend/.env
    restart: always
    networks:
      - app-network
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-${ENV}
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: always
    networks:
      - app-network
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
