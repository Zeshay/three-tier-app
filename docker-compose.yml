version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: backend-${ENV}
    ports:
      - "${BACKEND_PORT:-5003}:5000"
    env_file:
      - .env
    environment:
      MONGO_URI: "${MONGO_URI}"   # MongoDB Atlas connection
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health" || "exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

  frontend:
    image: ${FRONTEND_IMAGE}
    container_name: frontend-${ENV}
    ports:
      - "${FRONTEND_PORT:-3003}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    user: "1000:1000"

networks:
  app-network:
    driver: bridge
